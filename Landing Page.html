<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="description" content="Towber — On-demand roadside assistance and automotive marketplace for Lagos. Verified providers, transparent pricing, in-app escrow."/>
<title>Towber — Roadside help, on the way</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;background:#FAFAF7;color:#0A0A0A;-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.65}
h1,h2,h3,h4,h5{font-family:'Manrope',sans-serif;line-height:1.05;letter-spacing:-0.03em}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none}
img{display:block;max-width:100%}
:root{
  --ink:#0A0A0A;--lime:#C4F542;--lime-d:#aedd30;
  --white:#FFFFFF;--off:#F5F5F0;--warm:#FAFAF7;
  --card:#F0F0EB;--card-dark:#141414;
  --muted:rgba(10,10,10,0.5);--muted-d:rgba(255,255,255,0.55);
  --border:rgba(10,10,10,0.09);--border-d:rgba(255,255,255,0.09);
  --ok:#2DD47A;--danger:#FF3B30;
}
.c{max-width:1280px;margin:0 auto;padding:0 48px}
@media(max-width:900px){.c{padding:0 24px}}
.section{padding:128px 0}
.section-sm{padding:80px 0}
@media(max-width:768px){.section{padding:80px 0}.section-sm{padding:60px 0}}
/* Typography */
.h-xl{font-size:clamp(52px,7.5vw,100px);font-weight:800;line-height:.95;letter-spacing:-0.045em}
.h-lg{font-size:clamp(38px,5vw,68px);font-weight:700;line-height:1.05;letter-spacing:-0.035em}
.h-md{font-size:clamp(26px,3.5vw,44px);font-weight:700;line-height:1.1;letter-spacing:-0.03em}
.h-sm{font-size:clamp(18px,2.5vw,26px);font-weight:700;line-height:1.15;letter-spacing:-0.02em}
.body-xl{font-size:clamp(17px,1.5vw,21px);line-height:1.65;color:rgba(10,10,10,0.65)}
.body-lg{font-size:18px;line-height:1.65}
.body-md{font-size:16px;line-height:1.65}
.label{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:0 20px;height:44px;border-radius:99px;font-weight:600;font-size:14px;cursor:pointer;border:none;transition:transform .12s ease,box-shadow .12s ease,background .15s ease;font-family:'Inter',sans-serif;letter-spacing:-0.01em;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn-lime{background:var(--lime);color:var(--ink)}
.btn-lime:hover{background:var(--lime-d);box-shadow:0 10px 28px rgba(196,245,66,.28)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#1a1a1a;box-shadow:0 10px 28px rgba(0,0,0,.22)}
.btn-ghost-w{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.16)}
.btn-ghost-w:hover{background:rgba(255,255,255,0.13);border-color:rgba(255,255,255,0.35)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-lg{height:50px;padding:0 28px;font-size:15px}
/* Badges */
.badge{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:99px;font-size:12px;font-weight:600;font-family:'Inter',sans-serif}
.badge-lime{background:var(--lime);color:var(--ink)}
.badge-lime-soft{background:rgba(196,245,66,0.15);color:#7aae00;border:1px solid rgba(196,245,66,.3)}
.badge-outline-d{background:transparent;color:rgba(255,255,255,0.75);border:1px solid rgba(255,255,255,0.18)}
.badge-outline{background:transparent;color:var(--muted);border:1px solid var(--border)}
/* Cards */
.card{background:var(--white);border:1px solid var(--border);border-radius:24px}
.card-dark{background:#141414;border:1px solid var(--border-d);border-radius:24px}
.card-hover{transition:transform .2s ease,box-shadow .2s ease}
.card-hover:hover{transform:translateY(-4px);box-shadow:0 24px 60px rgba(0,0,0,.08)}
/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
@media(max-width:1024px){.grid-4{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:1fr 1fr}}
@media(max-width:768px){.grid-2{grid-template-columns:1fr}.grid-3{grid-template-columns:1fr}.grid-4{grid-template-columns:1fr 1fr}}
/* Dividers */
.hr{height:1px;background:var(--border)}
.hr-d{height:1px;background:var(--border-d)}
/* Dot grid bg */
.dot-grid{background-image:radial-gradient(circle,rgba(255,255,255,0.07) 1px,transparent 1px);background-size:32px 32px}
/* Scroll animation */
.fade-up{opacity:0;transform:translateY(28px);transition:opacity .6s cubic-bezier(.2,.7,.3,1),transform .6s cubic-bezier(.2,.7,.3,1)}
.fade-up.visible{opacity:1;transform:translateY(0)}
/* Input */
.input-field{height:54px;border-radius:99px;border:1.5px solid var(--border);font-size:15px;padding:0 22px;font-family:'Inter',sans-serif;outline:none;transition:border .15s;background:#fff;color:var(--ink);width:100%}
.input-field:focus{border-color:var(--ink)}
.input-field-dark{background:#1C1C1E;border-color:rgba(255,255,255,0.15);color:#fff}
.input-field-dark:focus{border-color:rgba(255,255,255,0.5)}
.input-field-dark::placeholder{color:rgba(255,255,255,0.35)}
/* Tab */
.tab-pill{display:flex;background:rgba(255,255,255,0.1);border-radius:99px;padding:4px;gap:2px}
/* Pill active */
.tab-option{padding:8px 18px;border-radius:99px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;border:none;font-family:'Inter',sans-serif}
.tab-option.active{background:#fff;color:var(--ink)}
.tab-option:not(.active){background:transparent;color:rgba(255,255,255,0.7)}
/* Star */
.star{color:#F0A500;font-size:14px}
/* Numbered step circle */
.step-num{width:48px;height:48px;borderRadius:50%;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;flex-shrink:0}
/* Responsive hero */
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr;gap:56px}}
.hide-mobile{display:block}
@media(max-width:900px){.hide-mobile{display:none}}
.steps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
@media(max-width:1024px){.steps-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.steps-grid{grid-template-columns:1fr}}
/* Trust strip */
.trust-item{padding:28px 0;text-align:center}
.trust-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-radius:20px;overflow:hidden;background:#fff;border:1px solid var(--border)}
@media(max-width:768px){.trust-grid{grid-template-columns:1fr 1fr}}
</style>
</head>

// ─── APP ──────────────────────────────────────────────────────────
function App() {
  const [mode, setMode] = useState('owner');
  useEffect(()=>{
    const obs = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('visible'); });
    },{ threshold:0.1 });
    document.querySelectorAll('.fade-up').forEach(el=>obs.observe(el));
    return ()=>obs.disconnect();
  },[mode]);
  useEffect(()=>{ window.scrollTo(0,0); },[mode]);

  return (
    <div>
      <Nav mode={mode} setMode={setMode}/>
      {mode === 'owner' ? (
        <>
          <OwnerHero setMode={setMode}/>
          <TrustBar/>
          <HowItWorks/>
          <NegotiateFeature/>
          <ServicesSection/>
          <SafetySection/>
          <Testimonials type="owner"/>
          <WaitlistCTA type="owner"/>
        </>
      ) : (
        <>
          <ProviderHero setMode={setMode}/>
          <EarningsSection/>
          <HowProviderWorks/>
          <PlansSection/>
          <Testimonials type="provider"/>
          <WaitlistCTA type="provider"/>
        </>
      )}
      <Footer setMode={setMode}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
